<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTU 双语字幕</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="../icons/icon32.png" alt="">
    <div class="titles">
      <div class="title" id="lectureTitle">NTU 双语字幕</div>
      <div class="status" id="status">正在连接…</div>
    </div>
    <label class="switch" title="视频上的双语字幕（Alt+Shift+S）">
      <input type="checkbox" id="enabled" aria-label="开启视频双语字幕">
      <span></span>
    </label>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.6c-.5.4-1.3.1-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z"/></svg>
      <span>对话</span><i class="lock-dot" title="需要 AI 精准模式"></i>
    </button>
    <button type="button" role="tab" data-tab="notes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v11.5A1.5 1.5 0 0 1 17.5 21h-10A1.5 1.5 0 0 1 6 19.5v-15A1.5 1.5 0 0 1 7.5 3zM14 3v5h5M9 12.5h6M9 16h6"/></svg>
      <span>笔记</span><i class="lock-dot" title="需要 AI 精准模式"></i>
    </button>
    <button type="button" role="tab" data-tab="transcript">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 10.5h10M4 15h16M4 19.5h7"/></svg>
      <span>译文</span>
    </button>
    <button type="button" role="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.7 7.7 0 0 0-2.6-1.5L14.2 2.5H9.8l-.3 2.5a7.7 7.7 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9a7.7 7.7 0 0 0 2.6 1.5l.3 2.5h4.4l.3-2.5a7.7 7.7 0 0 0 2.6-1.5l2.3.9 2-3.4z"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <main>
    <!-- ===================== 对话 ===================== -->
    <section class="view" id="view-chat" role="tabpanel">
      <div class="toolbar">
        <span class="tb-title">基于本节课内容问答</span>
        <span class="grow"></span>
        <button type="button" class="btn small ghost" id="chatClear">清空对话</button>
      </div>
      <div class="scroller" id="chatScroll"><div id="chatList"></div></div>
      <div class="composer">
        <div class="ctx" id="chatCtx"></div>
        <div class="input-row">
          <textarea id="chatInput" rows="1" placeholder="问问这节课…" title="Enter 发送，Shift+Enter 换行"></textarea>
          <button type="button" class="btn primary" id="chatSend" disabled>发送</button>
        </div>
      </div>
      <div class="lock-card"></div>
    </section>

    <!-- ===================== 笔记 ===================== -->
    <section class="view" id="view-notes" role="tabpanel">
      <div class="scroller" id="notesScroll"><div id="notesBody"></div></div>
      <button type="button" class="back-now" id="notesBack" hidden>回到当前位置</button>
      <div class="lock-card"></div>
    </section>

    <!-- ===================== 译文 ===================== -->
    <section class="view" id="view-transcript" role="tabpanel">
      <div class="toolbar">
        <div class="seg" id="trMode">
          <button type="button" data-v="both">双语</button>
          <button type="button" data-v="tr">译文</button>
          <button type="button" data-v="src">原文</button>
        </div>
        <span class="grow"></span>
        <button type="button" class="icon-btn" id="trRetranslate" title="重新翻译这节课">↻</button>
        <div class="menu-wrap">
          <button type="button" class="btn small" id="trExport">导出</button>
          <div class="menu" id="trExportMenu" hidden>
            <button type="button" data-fmt="srt">双语字幕 (.srt)</button>
            <button type="button" data-fmt="txt">双语文稿 (.txt)</button>
          </div>
        </div>
      </div>
      <div class="scroller" id="trScroll"><div id="trBody"></div></div>
      <button type="button" class="back-now" id="trBack" hidden>回到当前位置</button>
    </section>

    <!-- ===================== 设置 ===================== -->
    <section class="view" id="view-settings" role="tabpanel">
      <iframe id="settingsFrame" title="设置"></iframe>
    </section>
  </main>

  <template id="lockTpl">
    <div class="lock-inner">
      <div class="lock-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7.5a5 5 0 0 1 10 0V10"/><rect x="4.5" y="10" width="15" height="11" rx="2.5"/><path d="M12 14.5v2.5"/></svg>
      </div>
      <div class="lock-title"></div>
      <p>对话和笔记会把这节课的字幕发送给你自己配置的大模型，需要 <b>AI 精准模式</b>。基础模式（Google 翻译）只支持双语字幕和译文。</p>
      <button type="button" class="btn primary" data-goto="settings">去设置 AI 精准模式</button>
    </div>
  </template>

  <script src="../src/shared.js"></script>
  <script src="../src/llm.js"></script>
  <script src="md.js"></script>
  <script src="panel.js"></script>
  <script src="transcript.js"></script>
  <script src="notes.js"></script>
  <script src="chat.js"></script>
  <script src="main.js"></script>
</body>
</html>
